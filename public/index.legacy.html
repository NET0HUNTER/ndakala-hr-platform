<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ndakala Advisory LLP — HR & People Operations Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary: #0f3756;
      --primary-accent: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: #0f172a; }
    .focus-ring:focus { outline: 2px solid var(--primary-accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [csrfToken, setCsrfToken] = useState('');
      const [workspace, setWorkspace] = useState('my'); // 'my' | 'manager' | 'hr' | 'admin'
      const [notifications, setNotifications] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [org, setOrg] = useState(null);
      const [departments, setDepartments] = useState([]);
      const [users, setUsers] = useState([]);
      const [employees, setEmployees] = useState([]);
      const [ictRequests, setIctRequests] = useState([]);
      const [categories, setCategories] = useState([]);
      const [hrSubTab, setHrSubTab] = useState('employees'); // 'employees' | 'calendar' | 'leave-types' | 'ict' | 'departments'
      const [selectedEmployee, setSelectedEmployee] = useState(null);
      const [policies, setPolicies] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);

      // Phase 3 Leave & Absence State
      const [leaveBalances, setLeaveBalances] = useState([]);
      const [leaveTypes, setLeaveTypes] = useState([]);
      const [myLeaveRequests, setMyLeaveRequests] = useState([]);
      const [teamLeaveRequests, setTeamLeaveRequests] = useState([]);
      const [absences, setAbsences] = useState([]);
      const [showLeaveModal, setShowLeaveModal] = useState(false);
      const [showAbsenceModal, setShowAbsenceModal] = useState(false);
      const [leaveForm, setLeaveForm] = useState({
        leaveTypeCode: 'ANNUAL',
        startDate: '',
        endDate: '',
        isHalfDay: false,
        halfDayPeriod: 'MORNING',
        handoverEmployeeId: '',
        handoverNotes: '',
        reason: '',
        isRetrospective: false,
      });
      const [calcPreview, setCalcPreview] = useState(null);
      const [calcLoading, setCalcLoading] = useState(false);

      const [absenceForm, setAbsenceForm] = useState({
        employeeId: '',
        startDate: '2026-11-12',
        endDate: '',
        reasonCategory: 'SICKNESS',
        contactChannel: 'PHONE',
        notes: '',
      });

      // Phase 4 Governance, ER, Workforce & Separation State
      const [policyAcks, setPolicyAcks] = useState([]);
      const [trainingAssignments, setTrainingAssignments] = useState([]);
      const [requisitions, setRequisitions] = useState([]);
      const [surveyMetrics, setSurveyMetrics] = useState(null);
      const [transfers, setTransfers] = useState([]);
      const [erCases, setErCases] = useState([]);
      const [separations, setSeparations] = useState([]);
      const [showWhistleblowerModal, setShowWhistleblowerModal] = useState(false);
      const [whistleblowerForm, setWhistleblowerForm] = useState({
        title: '',
        allegationSummary: '',
        policyClausesCited: '',
        voluntaryContactName: '',
        voluntaryContactEmail: '',
      });
      const [whistleblowerResult, setWhistleblowerResult] = useState(null);
      const [trackTokenInput, setTrackTokenInput] = useState('');
      const [trackResult, setTrackResult] = useState(null);

      // Phase 5 Performance & PIP State
      const [performanceDashboard, setPerformanceDashboard] = useState(null);
      const [ratingScales, setRatingScales] = useState([]);
      const [performanceCycles, setPerformanceCycles] = useState([]);
      const [cycleMetrics, setCycleMetrics] = useState(null);
      const [selectedCycleId, setSelectedCycleId] = useState('');
      const [formulaConfig, setFormulaConfig] = useState(null);
      const [formulaSimulation, setFormulaSimulation] = useState(null);
      const [formulaSimulating, setFormulaSimulating] = useState(false);
      const [selectedFormulaModel, setSelectedFormulaModel] = useState('QUARTERLY_WEIGHTED');
      const [selectedRounding, setSelectedRounding] = useState('NEAREST_HALF');
      const [customQuarterlyWeights, setCustomQuarterlyWeights] = useState({ Q1: 15, Q2: 20, Q3: 25, Q4: 40 });
      const [customHybridWeights, setCustomHybridWeights] = useState({ quarterlyComponent: 40, annualComponent: 60 });
      const [formulaJustification, setFormulaJustification] = useState('Recommended policy-aligned annual composite configuration');
      const [formulaActionMsg, setFormulaActionMsg] = useState(null);
      const [showNewObjectiveModal, setShowNewObjectiveModal] = useState(false);
      const [showSelfAppraisalModal, setShowSelfAppraisalModal] = useState(false);
      const [showNewPipModal, setShowNewPipModal] = useState(false);
      const [selfAppraisalForm, setSelfAppraisalForm] = useState({
        selfAchievements: '',
        strength1: '',
        strength2: '',
        improvementArea1: '',
        improvementArea2: '',
        selfChallenges: '',
        selfSupportRequired: '',
      });
      const [pipForm, setPipForm] = useState({
        employeeId: '',
        lineManagerId: '',
        triggerReason: 'FIRST_TIME_RATING_2',
        durationMonths: 3,
        startDate: '2026-11-15',
        endDate: '2027-02-15',
        baselineAssessment: '',
        smartTarget1: '',
        measurement1: '',
        supportRequired1: '',
      });

      // Phase 6 Kenyan Payroll & Remuneration State
      const [payrollPayGroups, setPayrollPayGroups] = useState([]);
      const [payrollRuleSets, setPayrollRuleSets] = useState([]);
      const [payrollPeriods, setPayrollPeriods] = useState([]);
      const [payrollRuns, setPayrollRuns] = useState([]);
      const [selectedPayrollPeriodId, setSelectedPayrollPeriodId] = useState('');
      const [selectedRunId, setSelectedRunId] = useState('');
      const [selectedRunSlips, setSelectedRunSlips] = useState([]);
      const [selectedSlipDetail, setSelectedSlipDetail] = useState(null);
      const [payrollReconReport, setPayrollReconReport] = useState(null);
      const [payrollBankExport, setPayrollBankExport] = useState(null);
      const [payrollActionMsg, setPayrollActionMsg] = useState(null);
      const [payrollLoading, setPayrollLoading] = useState(false);

      // What-If Simulation Sandbox State
      const [simForm, setSimForm] = useState({
        employeeName: 'Simulated Senior Consultant',
        basicSalary: 150000,
        houseAllowance: 35000,
        commuterAllowance: 15000,
        daysWorkedInMonth: 30,
        totalWorkingDays: 30,
      });
      const [simResult, setSimResult] = useState(null);
      const [simLoading, setSimLoading] = useState(false);

      // Phase 7 Hardening, Integrations & Handover State
      const [hardeningMetrics, setHardeningMetrics] = useState(null);
      const [integrationsList, setIntegrationsList] = useState([]);
      const [privacyDsrs, setPrivacyDsrs] = useState([]);
      const [privacyLegalHolds, setPrivacyLegalHolds] = useState([]);
      const [ssrfTestUrl, setSsrfTestUrl] = useState('http://169.254.169.254/latest/meta-data');
      const [ssrfTestResult, setSsrfTestResult] = useState(null);
      const [siemTestStatus, setSiemTestStatus] = useState(null);
      const [hardeningHealth, setHardeningHealth] = useState(null);
      const [hardeningReady, setHardeningReady] = useState(null);

      const [loginEmail, setLoginEmail] = useState('managing.partner@ndakalaadvisory.co.ke');
      const [loginPassword, setLoginPassword] = useState('Ndakala@Secure2026!');
      const [loginError, setLoginError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        fetchCurrentUser();
      }, []);

      async function fetchCurrentUser() {
        try {
          const res = await fetch('/api/v1/auth/me');
          if (res.ok) {
            const data = await res.json();
            setCurrentUser({ ...data.data.user, roles: data.data.roles || [], permissions: data.data.permissions || [] });
            setCsrfToken(data.data.csrfToken);
            loadWorkspaceData();
          }
        } catch (err) {
          console.error(err);
        }
      }

      async function handleLogin(e) {
        e.preventDefault();
        setLoading(true);
        setLoginError('');
        try {
          const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPassword }),
          });
          const data = await res.json();
          if (!res.ok) {
            setLoginError(data.error?.message || 'Login failed');
            return;
          }
          setCsrfToken(data.data.csrfToken);
          setCurrentUser({ ...data.data.user, roles: data.data.roles || [], permissions: data.data.permissions || [] });
          loadWorkspaceData();
        } catch (err) {
          setLoginError('Network error connecting to API');
        } finally {
          setLoading(false);
        }
      }

      async function handleLogout() {
        await fetch('/api/v1/auth/logout', {
          method: 'POST',
          headers: { 'x-csrf-token': csrfToken },
        });
        setCurrentUser(null);
      }

      async function loadWorkspaceData() {
        // Fetch Org
        const orgRes = await fetch('/api/v1/organisation');
        if (orgRes.ok) setOrg((await orgRes.json()).data);

        // Fetch Tasks
        const tasksRes = await fetch('/api/v1/tasks/inbox');
        if (tasksRes.ok) setTasks((await tasksRes.json()).data);

        // Fetch Notifications
        const notifRes = await fetch('/api/v1/notifications');
        if (notifRes.ok) setNotifications((await notifRes.json()).data);

        // Fetch Departments
        const deptRes = await fetch('/api/v1/departments');
        if (deptRes.ok) setDepartments((await deptRes.json()).data);

        // Fetch Users
        const userRes = await fetch('/api/v1/users');
        if (userRes.ok) setUsers((await userRes.json()).data);

        // Fetch Employees
        const empRes = await fetch('/api/v1/employees');
        if (empRes.ok) setEmployees((await empRes.json()).data.items || []);

        // Fetch ICT Requests
        const ictRes = await fetch('/api/v1/ict-requests');
        if (ictRes.ok) setIctRequests((await ictRes.json()).data || []);

        // Fetch Employee Categories
        const catRes = await fetch('/api/v1/employee-categories');
        if (catRes.ok) setCategories((await catRes.json()).data || []);

        // Fetch Policies
        const polRes = await fetch('/api/v1/configuration');
        if (polRes.ok) setPolicies((await polRes.json()).data);

        // Fetch Audit Logs
        const auditRes = await fetch('/api/v1/audit-logs?limit=20');
        if (auditRes.ok) setAuditLogs((await auditRes.json()).data.items);

        // Phase 3: Leave Balances & Types
        try {
          const balRes = await fetch('/api/v1/leave/balances');
          if (balRes.ok) setLeaveBalances((await balRes.json()).data || []);
        } catch (e) {}

        try {
          const ltRes = await fetch('/api/v1/leave/types');
          if (ltRes.ok) setLeaveTypes((await ltRes.json()).data || []);
        } catch (e) {}

        // Phase 3: Leave Requests
        try {
          const lrRes = await fetch('/api/v1/leave/requests');
          if (lrRes.ok) setMyLeaveRequests((await lrRes.json()).data || []);
        } catch (e) {}

        // Phase 3: Team Requests (Calendar)
        try {
          const tlrRes = await fetch('/api/v1/leave/requests?teamOnly=true');
          if (tlrRes.ok) setTeamLeaveRequests((await tlrRes.json()).data || []);
        } catch (e) {}

        // Phase 3: Absences
        try {
          const absRes = await fetch('/api/v1/absences');
          if (absRes.ok) setAbsences((await absRes.json()).data || []);
        } catch (e) {}

        // Phase 4: Policy Acknowledgements
        try {
          const paRes = await fetch('/api/v1/governance/policies/acknowledgements');
          if (paRes.ok) setPolicyAcks((await paRes.json()).data || []);
        } catch (e) {}

        // Phase 4: Training Assignments
        try {
          const trRes = await fetch('/api/v1/governance/training/my-assignments');
          if (trRes.ok) setTrainingAssignments((await trRes.json()).data || []);
        } catch (e) {}

        // Phase 4: Workforce Requisitions
        try {
          const reqRes = await fetch('/api/v1/workforce/requisitions');
          if (reqRes.ok) setRequisitions((await reqRes.json()).data || []);
        } catch (e) {}

        // Phase 4: Recruitment Survey Metrics
        try {
          const smRes = await fetch('/api/v1/workforce/surveys/metrics');
          if (smRes.ok) setSurveyMetrics((await smRes.json()).data || null);
        } catch (e) {}

        // Phase 4: Transfers
        try {
          const trfRes = await fetch('/api/v1/workforce/transfers');
          if (trfRes.ok) setTransfers((await trfRes.json()).data || []);
        } catch (e) {}

        // Phase 4: ER Cases
        try {
          const erRes = await fetch('/api/v1/er/cases');
          if (erRes.ok) setErCases((await erRes.json()).data || []);
        } catch (e) {}

        // Phase 4: Separations
        try {
          const sepRes = await fetch('/api/v1/separation');
          if (sepRes.ok) setSeparations((await sepRes.json()).data || []);
        } catch (e) {}

        // Phase 5: Performance & PIP Data
        try {
          const dashRes = await fetch('/api/v1/performance/dashboard');
          if (dashRes.ok) setPerformanceDashboard((await dashRes.json()).data || null);
        } catch (e) {}

        try {
          const scRes = await fetch('/api/v1/performance/rating-scales');
          if (scRes.ok) setRatingScales((await scRes.json()).data || []);
        } catch (e) {}

        try {
          const cycRes = await fetch('/api/v1/performance/cycles');
          if (cycRes.ok) {
            const cycles = (await cycRes.json()).data || [];
            setPerformanceCycles(cycles);
            if (cycles.length > 0) {
              const activeC = cycles.find((c) => c.status === 'ACTIVE') || cycles[0];
              setSelectedCycleId(activeC.id);
              const metRes = await fetch(`/api/v1/performance/cycles/${activeC.id}/metrics`);
              if (metRes.ok) setCycleMetrics((await metRes.json()).data || null);
              const fcRes = await fetch(`/api/v1/performance/cycles/${activeC.id}/formula-config`);
              if (fcRes.ok) {
                const fc = (await fcRes.json()).data;
                setFormulaConfig(fc);
                if (fc.annualFormulaModel) setSelectedFormulaModel(fc.annualFormulaModel);
                if (fc.roundingMethod) setSelectedRounding(fc.roundingMethod);
                if (fc.annualFormulaWeights) {
                  if (fc.annualFormulaWeights.Q1 !== undefined) {
                    setCustomQuarterlyWeights({
                      Q1: Number(fc.annualFormulaWeights.Q1) || 15,
                      Q2: Number(fc.annualFormulaWeights.Q2) || 20,
                      Q3: Number(fc.annualFormulaWeights.Q3) || 25,
                      Q4: Number(fc.annualFormulaWeights.Q4) || 40,
                    });
                  }
                  if (fc.annualFormulaWeights.quarterlyComponent !== undefined) {
                    setCustomHybridWeights({
                      quarterlyComponent: Number(fc.annualFormulaWeights.quarterlyComponent) || 40,
                      annualComponent: Number(fc.annualFormulaWeights.annualComponent) || 60,
                    });
                  }
                }
              }
            }
          }
        } catch (e) {}

        // Phase 6: Payroll Data
        try {
          const pgRes = await fetch('/api/v1/payroll/pay-groups');
          if (pgRes.ok) setPayrollPayGroups((await pgRes.json()).data || []);
        } catch (e) {}

        try {
          const rsRes = await fetch('/api/v1/payroll/rule-sets');
          if (rsRes.ok) setPayrollRuleSets((await rsRes.json()).data || []);
        } catch (e) {}

        try {
          const prRes = await fetch('/api/v1/payroll/periods');
          if (prRes.ok) {
            const periods = (await prRes.json()).data || [];
            setPayrollPeriods(periods);
            if (periods.length > 0) {
              const activeP = periods[0];
              setSelectedPayrollPeriodId(activeP.id);
              loadPeriodRuns(activeP.id);
            }
          }
        } catch (e) {}

        // Phase 7: Hardening, Observability & Integrations
        loadHardeningData();
      }

      async function loadHardeningData() {
        try {
          const [hRes, rRes, mRes, iRes, dRes, lRes] = await Promise.all([
            fetch('/api/v1/health').catch(() => null),
            fetch('/api/v1/ready').catch(() => null),
            fetch('/api/v1/metrics').catch(() => null),
            fetch('/api/v1/integrations/configs').catch(() => null),
            fetch('/api/v1/privacy/dsr').catch(() => null),
            fetch('/api/v1/privacy/legal-holds').catch(() => null),
          ]);
          if (hRes && hRes.ok) setHardeningHealth(await hRes.json());
          if (rRes && rRes.ok) setHardeningReady(await rRes.json());
          if (mRes && mRes.ok) setHardeningMetrics(await mRes.json());
          if (iRes && iRes.ok) setIntegrationsList((await iRes.json()).data || []);
          if (dRes && dRes.ok) setPrivacyDsrs((await dRes.json()).data || []);
          if (lRes && lRes.ok) setPrivacyLegalHolds((await lRes.json()).data || []);
        } catch (err) {
          console.error('Error loading hardening data', err);
        }
      }

      async function handleTriggerSIEMTest() {
        setSiemTestStatus('Dispatching security audit probe...');
        try {
          const res = await fetch('/api/v1/integrations/siem/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
            body: JSON.stringify({
              severity: 'HIGH',
              eventType: 'SECURITY_HARDENING_VERIFICATION',
              resourceType: 'INTEGRATIONS_GATEWAY',
              action: 'MANUAL_INTEGRITY_PROBE',
              outcome: 'SUCCESS',
            }),
          });
          const data = await res.json();
          if (res.ok) {
            setSiemTestStatus(`Audit event recorded & forwarded: Log ID ${data.data.logId} (Status: ${data.data.status})`);
          } else {
            setSiemTestStatus(`Failed: ${data.error?.message || 'Unauthorized'}`);
          }
        } catch (e) {
          setSiemTestStatus('Network error triggering SIEM test');
        }
      }

      async function handleValidateSSRF(e) {
        if (e) e.preventDefault();
        try {
          const res = await fetch('/api/v1/integrations/ssrf-validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
            body: JSON.stringify({ url: ssrfTestUrl }),
          });
          const data = await res.json();
          setSsrfTestResult(data.data);
        } catch (e) {
          alert('Network error during SSRF validation');
        }
      }

      async function handleDownloadPortability(empId) {
        try {
          const res = await fetch(`/api/v1/privacy/dsr/export/${empId}`);
          if (!res.ok) {
            const err = await res.json();
            alert('Export failed: ' + (err.error?.message || 'Access denied'));
            return;
          }
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Ndakala_Data_Portability_Archive_${empId.slice(0, 8)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        } catch (e) {
          alert('Network error downloading portability archive');
        }
      }

      async function loadPeriodRuns(periodId) {
        if (!periodId) return;
        try {
          const res = await fetch(`/api/v1/payroll/periods/${periodId}/runs`);
          if (res.ok) {
            const runs = (await res.json()).data || [];
            setPayrollRuns(runs);
            if (runs.length > 0) {
              setSelectedRunId(runs[0].id);
              loadRunSlips(runs[0].id);
            } else {
              setSelectedRunId('');
              setSelectedRunSlips([]);
            }
          }
        } catch (e) {
          console.error('Error loading period runs', e);
        }
      }

      async function loadRunSlips(runId) {
        if (!runId) return;
        try {
          const res = await fetch(`/api/v1/payroll/runs/${runId}/slips`);
          if (res.ok) {
            setSelectedRunSlips((await res.json()).data || []);
          }
        } catch (e) {
          console.error('Error loading run slips', e);
        }
      }

      async function handleInitiateRun() {
        if (!selectedPayrollPeriodId) {
          alert('Please select a payroll period first.');
          return;
        }
        setPayrollLoading(true);
        setPayrollActionMsg(null);
        try {
          const defaultRuleSet = payrollRuleSets.find((r) => r.isDefault || r.status === 'ACTIVE');
          const res = await fetch(`/api/v1/payroll/periods/${selectedPayrollPeriodId}/runs`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
            body: JSON.stringify({ ruleSetId: defaultRuleSet?.id }),
          });
          const data = await res.json();
          if (!res.ok) {
            setPayrollActionMsg({ type: 'error', text: data.error?.message || 'Failed to initiate run' });
            return;
          }
          setPayrollActionMsg({ type: 'success', text: `Payroll Run #${data.data.runNumber} initiated in DRAFT status.` });
          loadPeriodRuns(selectedPayrollPeriodId);
        } catch (err) {
          setPayrollActionMsg({ type: 'error', text: 'Network error initiating payroll run.' });
        } finally {
          setPayrollLoading(false);
        }
      }

      async function handleCalculateRun(runId) {
        setPayrollLoading(true);
        setPayrollActionMsg(null);
        try {
          const res = await fetch(`/api/v1/payroll/runs/${runId}/calculate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
          });
          const data = await res.json();
          if (!res.ok) {
            setPayrollActionMsg({ type: 'error', text: data.error?.message || 'Failed to calculate run' });
            return;
          }
          setPayrollActionMsg({
            type: 'success',
            text: `Calculated ${data.data.totalEmployeesCount} slips. Total Gross: KES ${data.data.totalGrossPay.toLocaleString()}, Net Pay: KES ${data.data.totalNetPay.toLocaleString()}, Employer Cost: KES ${data.data.totalEmployerCosts.toLocaleString()}`,
          });
          loadPeriodRuns(selectedPayrollPeriodId);
          loadRunSlips(runId);
        } catch (err) {
          setPayrollActionMsg({ type: 'error', text: 'Network error calculating payroll run.' });
        } finally {
          setPayrollLoading(false);
        }
      }

      async function handleSubmitRunForReview(runId) {
        setPayrollLoading(true);
        setPayrollActionMsg(null);
        try {
          const res = await fetch(`/api/v1/payroll/runs/${runId}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
          });
          const data = await res.json();
          if (!res.ok) {
            setPayrollActionMsg({ type: 'error', text: data.error?.message || 'Failed to submit run' });
            return;
          }
          setPayrollActionMsg({ type: 'success', text: 'Payroll run submitted for executive review (UNDER_REVIEW).' });
          loadPeriodRuns(selectedPayrollPeriodId);
        } catch (err) {
          setPayrollActionMsg({ type: 'error', text: 'Network error submitting payroll run.' });
        } finally {
          setPayrollLoading(false);
        }
      }

      async function handleApproveRun(runId) {
        setPayrollLoading(true);
        setPayrollActionMsg(null);
        try {
          const res = await fetch(`/api/v1/payroll/runs/${runId}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
          });
          const data = await res.json();
          if (!res.ok) {

          if (sum !== 100) {
            setFormulaActionMsg({ type: 'error', text: `Quarterly weights must sum to exactly 100% (currently ${sum}%).` });

          }
          weightsToSend = customQuarterlyWeights;
        } else if (selectedFormulaModel === 'HYBRID_SPLIT') {

            setFormulaActionMsg({ type: 'error', text: `Hybrid split weights must sum to exactly 100% (currently ${sum}%).` });

                    </div>

                    {/* New Report Form */}
                    <form onSubmit={handleSubmitWhistleblower} className="space-y-3">
                      <span className="font-bold text-slate-800 block">Submit Confidential Report</span>
                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Report Subject / Allegation Title *</label>
                        <input
                          type="text"
                          value={whistleblowerForm.title}
                          onChange={(e) => setWhistleblowerForm({ ...whistleblowerForm, title: e.target.value })}
                          required
                          placeholder="Brief description of the concern..."
                          className="w-full px-3 py-1.5 border border-slate-300 rounded focus-ring text-xs"
                        />
                      </div>

                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Detailed Factual Allegations *</label>
                        <textarea
                          value={whistleblowerForm.allegationSummary}
                          onChange={(e) => setWhistleblowerForm({ ...whistleblowerForm, allegationSummary: e.target.value })}
                          required
                          rows="3"
                          placeholder="Describe specific events, dates, individuals involved, or evidence..."
                          className="w-full px-3 py-1.5 border border-slate-300 rounded focus-ring text-xs"
                        />
                      </div>

                      <div>
                        <label className="block font-semibold text-slate-700 mb-1">Policy / Ethical Standards Cited (Optional)</label>
                        <input
                          type="text"
                          value={whistleblowerForm.policyClausesCited}
                          onChange={(e) => setWhistleblowerForm({ ...whistleblowerForm, policyClausesCited: e.target.value })}
                          placeholder="e.g. Anti-Bribery §3, Code of Conduct §5"
                          className="w-full px-3 py-1.5 border border-slate-300 rounded focus-ring text-xs"
                        />
                      </div>

                      <div className="p-3 bg-slate-50 border border-slate-200 rounded space-y-2">
                        <span className="font-semibold text-slate-700 block">Voluntary Contact Details (Encrypted at Rest)</span>
                        <p className="text-[11px] text-slate-500">
                          Leave blank to remain completely anonymous. If provided, identity is encrypted with AES-256-GCM in the restricted evidence vault.
                        </p>
                        <div className="grid grid-cols-2 gap-2">
                          <input
                            type="text"
                            placeholder="Your Name (Optional)"
                            value={whistleblowerForm.voluntaryContactName}
                            onChange={(e) => setWhistleblowerForm({ ...whistleblowerForm, voluntaryContactName: e.target.value })}
                            className="px-2.5 py-1.5 border border-slate-300 rounded text-xs"
                          />
                          <input
                            type="email"
                            placeholder="Your Email (Optional)"
                            value={whistleblowerForm.voluntaryContactEmail}
                            onChange={(e) => setWhistleblowerForm({ ...whistleblowerForm, voluntaryContactEmail: e.target.value })}
                            className="px-2.5 py-1.5 border border-slate-300 rounded text-xs"
                          />
                        </div>
                      </div>

                      <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                        <button
                          type="button"
                          onClick={() => setShowWhistleblowerModal(false)}
                          className="px-3.5 py-1.5 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded font-medium"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="px-4 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded font-semibold"
                        >
                          Submit Report Securely
                        </button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
